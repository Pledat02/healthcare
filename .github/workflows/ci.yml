name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & unit test (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Aggregator build ca 6 service bang 1 lenh. Unit test mock het (khong can DB/Keycloak/Redis/Kafka);
      # cac *ApplicationTests nap context da @Disabled nen bi bo qua tren CI.
      - name: Build & run unit tests
        run: mvn -B -f backend/pom.xml test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  docker-build:
    name: Build images (tag = commit SHA)
    runs-on: ubuntu-latest
    needs: build-test
    # Chi build image khi da merge vao main (khong tren PR) de tiet kiem CI.
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - { name: api-gateway,            port: 8090 }
          - { name: patient-service,        port: 8081 }
          - { name: doctor-service,         port: 8082 }
          - { name: appointment-service,    port: 8083 }
          - { name: notification-service,   port: 8084 }
          - { name: medical-record-service, port: 8085 }
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image co tag BAT BIEN theo commit SHA (khong chi :latest) -> rollback duoc.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service.name }}
            APP_PORT=${{ matrix.service.port }}
          tags: |
            healthcare/${{ matrix.service.name }}:${{ github.sha }}
            healthcare/${{ matrix.service.name }}:latest
          push: false          # chua co registry -> chi build. Them login + push khi co registry.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image scan (CVE) - khong fail build o muc nay, chi bao cao.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: healthcare/${{ matrix.service.name }}:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
