name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & unit test (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Aggregator build ca 6 service bang 1 lenh. Unit test mock het (khong can DB/Keycloak/Redis/Kafka);
      # cac *ApplicationTests nap context da @Disabled nen bi bo qua tren CI.
      - name: Build & run unit tests
        run: mvn -B -f backend/pom.xml test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
