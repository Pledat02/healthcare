name: healthcare-identity

services:
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - identity-db

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    image: healthcare-keycloak:26.4
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME:?Set KEYCLOAK_HOSTNAME in .env}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD in .env}
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - identity-edge
      - identity-db

  keycloak-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      KEYCLOAK_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Set KEYCLOAK_HOSTNAME in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_LOCAL_PROXY_PORT:-8088}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - identity-edge

  # Public hostname trong Tunnel tro toi http://keycloak-tls:8080.
  keycloak-cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    profiles: ["cloudflare"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_KEYCLOAK_TUNNEL_TOKEN:-}
    depends_on:
      keycloak-tls:
        condition: service_started
    networks:
      - identity-edge

volumes:
  keycloak_db_data:

networks:
  identity-edge:
  identity-db:
    internal: true
