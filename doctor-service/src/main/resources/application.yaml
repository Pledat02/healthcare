server:
  port: 8082

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore, khong day len GitHub)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: doctor-service

  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.ewxubwczuqljaqbyjnmp
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/healthcare

# US-03: tao tai khoan dang nhap cho bac si qua Keycloak Admin API.
# admin-client-secret nam trong secrets.yaml (da gitignore).
keycloak:
  server-url: http://localhost:8080
  realm: healthcare
  admin-client-id: healthcare-admin-cli