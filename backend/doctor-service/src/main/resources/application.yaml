server:
  port: 8082

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore, khong day len GitHub)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: doctor-service

  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.ewxubwczuqljaqbyjnmp
    driver-class-name: org.postgresql.Driver
    # Supabase free: 15 ket noi/project. 3 service dung chung project Mumbai.
    hikari:
      maximum-pool-size: 4

  # Redis cache: danh sach bac si doc rat nhieu, doi rat it -> cache 10 phut
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000        # 10 phut
      cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

# US-03: tao tai khoan dang nhap cho bac si qua Keycloak Admin API.
# admin-client-secret nam trong secrets.yaml (da gitignore).
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:healthcare}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:healthcare-admin-cli}
