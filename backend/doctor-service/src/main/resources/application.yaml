server:
  port: 8082

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore, khong day len GitHub)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: doctor-service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.nxfrravtjtxnjrwldfse
    driver-class-name: org.postgresql.Driver
    # Supabase free: 15 ket noi/project. 5 service dung chung project Singapore.
    hikari:
      maximum-pool-size: 2

  # Redis cache: danh sach bac si doc rat nhieu, doi rat it -> cache 10 phut
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000        # 10 phut
      cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

# US-03: tao tai khoan dang nhap cho bac si qua Keycloak Admin API.
# admin-client-secret nam trong secrets.yaml (da gitignore).
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:healthcare}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:healthcare-admin-cli}

# Anh chi luu object path trong PostgreSQL; binary nam trong Supabase Storage.
# Service-role key la server secret, tuyet doi khong dua vao frontend/Vite env.
medibook:
  doctor-avatar:
    supabase-url: ${SUPABASE_URL:https://nxfrravtjtxnjrwldfse.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_DOCTOR_AVATAR_BUCKET:doctor-avatars}
    max-bytes: ${DOCTOR_AVATAR_MAX_BYTES:5242880}
    seed-enabled: ${DOCTOR_AVATAR_SEED_ENABLED:false}

# ----- BL-07 Observability (Actuator + Prometheus + distributed tracing) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true          # /actuator/prometheus cho Prometheus scrape
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev 1.0; prod ha thap qua env

# traceId/spanId vao moi dong log -> tra cuu 1 request xuyen nhieu service
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
# PROD: log JSON (ECS) cho log aggregator (Boot 4.1 structured logging native)
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
