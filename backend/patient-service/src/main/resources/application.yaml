server:
  port: 8081

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore, khong day len GitHub)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: patient-service

  datasource:
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.nxfrravtjtxnjrwldfse
    driver-class-name: org.postgresql.Driver
    # Supabase free: 15 ket noi/project. 5 service dung chung project Singapore.
    hikari:
      maximum-pool-size: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ----- BL-07 Observability (Actuator + Prometheus + distributed tracing) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true          # /actuator/prometheus cho Prometheus scrape
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev 1.0; prod ha thap qua env

# traceId/spanId vao moi dong log -> tra cuu 1 request xuyen nhieu service
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
# PROD: log JSON (ECS) cho log aggregator (Boot 4.1 structured logging native)
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
