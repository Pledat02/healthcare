server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # CORS: cho phep frontend (cong khac) goi vao gateway
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${FRONTEND_URL:http://localhost:3000}"    # prod: dat FRONTEND_URL
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: patient-service
              uri: ${PATIENT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/patients/**

            - id: doctor-service
              uri: ${DOCTOR_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/doctors/**

            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/appointments/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

            - id: medical-record-service
              uri: ${MEDICAL_RECORD_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/medical-records/**

            - id: security-service
              uri: ${SECURITY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/security/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

  # Xac thuc JWT Keycloak ngay tai cong
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

security:
  event-topic: ${SECURITY_EVENT_TOPIC:security-access-events}
  rate-limit-per-minute: ${SECURITY_RATE_LIMIT_PER_MINUTE:120}
  cloudflare:
    enabled: ${SECURITY_CLOUDFLARE_ENABLED:false}
    # Prod: tu choi moi request khong di qua connector/proxy Cloudflare tin cay.
    required: ${SECURITY_CLOUDFLARE_REQUIRED:false}
    # Voi compose Tunnel, chi trust IP tinh cua container cloudflared tren edge network.
    trusted-proxy-cidrs: ${SECURITY_CLOUDFLARE_TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  # Chi bat khi gateway nam sau reverse proxy da XOA header do client tu gui.
  # Cloudflare mode khong dung X-Forwarded-For; no dung CF-Connecting-IP da xac minh.
  trust-forwarded-for: ${SECURITY_TRUST_FORWARDED_FOR:false}

# ----- BL-07 Observability (Actuator + Prometheus + distributed tracing) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true          # /actuator/prometheus cho Prometheus scrape
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev 1.0; prod ha thap qua env

# traceId/spanId vao moi dong log -> tra cuu 1 request xuyen nhieu service
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
# PROD: log JSON (ECS) cho log aggregator (Boot 4.1 structured logging native)
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
