server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # CORS: cho phep frontend (cong khac) goi vao gateway
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${FRONTEND_URL:http://localhost:3000}"    # prod: dat FRONTEND_URL
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: patient-service
              uri: ${PATIENT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/patients/**

            - id: doctor-service
              uri: ${DOCTOR_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/doctors/**

            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/appointments/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

            - id: medical-record-service
              uri: ${MEDICAL_RECORD_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/medical-records/**

  # Xac thuc JWT Keycloak ngay tai cong
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

# ----- BL-07 Observability (Actuator + Prometheus + distributed tracing) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true          # /actuator/prometheus cho Prometheus scrape
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev 1.0; prod ha thap qua env

# traceId/spanId vao moi dong log -> tra cuu 1 request xuyen nhieu service
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
# PROD: log JSON (ECS) cho log aggregator (Boot 4.1 structured logging native)
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
