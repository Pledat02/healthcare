server:
  port: 8085

services:
  appointment:
    url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
  patient:
    url: ${PATIENT_SERVICE_URL:http://localhost:8081}
  doctor:
    url: ${DOCTOR_SERVICE_URL:http://localhost:8082}

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: medical-record-service

  # Dung chung Supabase project voi patient-service (Singapore / ap-southeast-1)
  datasource:
    url: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.nxfrravtjtxnjrwldfse
    driver-class-name: org.postgresql.Driver
    # Supabase free: 15 ket noi/project. patient + medical-record dung chung project Singapore.
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true   # in "Session Metrics { N JDBC statements }" moi request -> bat N+1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

# CHI DUNG DEV: bat log thong ke + gia tri tham so de soi query. Production phai TAT.
logging:
  level:
    # Hibernate 7 (Spring Boot 4.1) doi namespace logger -> org.hibernate.orm.*
    org.hibernate.orm.stat: DEBUG      # in dong "Session Metrics { ... N JDBC statements }"
    org.hibernate.orm.jdbc.bind: TRACE # in gia tri thuc cua cac dau ? trong SQL
