server:
  port: 8084

services:
  appointment:
    url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
  patient:
    url: ${PATIENT_SERVICE_URL:http://localhost:8081}

spring:
  # Mat khau DB + mat khau email nam trong secrets.yaml (da gitignore)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: notification-service

  sql:
    init:
      mode: always

  # Dung chung Supabase project voi doctor-service + appointment-service (Mumbai / ap-south-1)
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.ewxubwczuqljaqbyjnmp
    driver-class-name: org.postgresql.Driver
    # Supabase free chi cho 15 ket noi/project (session mode), ma 3 service
    # doctor + appointment + notification dung chung project nay -> gioi han pool.
    hikari:
      maximum-pool-size: 4

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

  # Kafka consumer: nhan su kien lich hen. Producer tat type-header nen phai khai type mac dinh.
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.hehe.notification_service.dto.event.AppointmentNotificationEvent
        spring.json.trusted.packages: "*"

  # US-08/US-09: gui email. Username/password nam trong secrets.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Cau hinh nghiep vu
notification:
  mail-from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@medibook.local}}
  reminder-hours-before: 24     # US-09: nhac truoc 24 gio
  scan-cron: "0 * * * * *"      # quet moi phut (doi "0 0 * * * *" = moi gio khi len that)
  batch-size: 50
  claim-timeout: PT20M
  scheduler-lock-at-most: PT15M
  scheduler-lock-at-least: PT5S

# Topic Kafka lang nghe (khop voi appointment-service)
notification-topic: appointment-events

# ----- BL-07 Observability (Actuator + Prometheus + distributed tracing) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + /readiness
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true          # /actuator/prometheus cho Prometheus scrape
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev 1.0; prod ha thap qua env

# traceId/spanId vao moi dong log -> tra cuu 1 request xuyen nhieu service
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

---
# PROD: log JSON (ECS) cho log aggregator (Boot 4.1 structured logging native)
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
