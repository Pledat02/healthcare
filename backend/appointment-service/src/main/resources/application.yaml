server:
  port: 8083

services:
  doctor:
    url: ${DOCTOR_SERVICE_URL:http://localhost:8082}
  patient:
    url: ${PATIENT_SERVICE_URL:http://localhost:8081}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}

spring:
  # Mat khau DB nam trong secrets.yaml (da gitignore, khong day len GitHub)
  config:
    import: optional:classpath:secrets.yaml

  application:
    name: appointment-service

  # Dung chung Supabase project voi doctor-service (Mumbai / ap-south-1)
  # Schema mac dinh "public" -> Hibernate tu tao bang, khong can tao schema tay
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.ewxubwczuqljaqbyjnmp
    driver-class-name: org.postgresql.Driver
    # Supabase free: 15 ket noi/project. 3 service dung chung project Mumbai.
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/healthcare}

  # Kafka producer: ban su kien dat lich (JSON). Tat type-header de consumer (khac package) doc duoc.
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000   # Kafka chet -> send() fail nhanh, khong treo dat lich (PRD muc 6)

# Service-account de goi API noi bo cua service khac (secret trong secrets.yaml)
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:healthcare}
  internal-client-id: ${KEYCLOAK_INTERNAL_CLIENT_ID:healthcare-admin-cli}

# Cau hinh nghiep vu (PRD BR-01: moi buoi kham mac dinh 30 phut)
appointment:
  duration-minutes: 30

# Ten topic Kafka cho su kien lich hen
notification-topic: appointment-events
